<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Document</title>
</head>

<body class="body">
    <div class="wrapper">
        <header class="header">
            <!--logo-->
            <div class="header-logo">
                <a href="#">
                    <img src="./img/logo.svg" alt="logo vector">
                    <!-- <img src="./img/logo-greenshop.svg" alt="greenshop"> -->
                </a>
            </div>
            <!--navigation-->
            <div class="header-navigation">
                <nav>
                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">Shop</a></li>
                        <li><a href="#">Plant Care</a></li>
                        <li><a href="#">Blogs</a></li>
                    </ul>
                </nav>
            </div>
            <!--login-->
            <button type="button" class="login">
                <img src="./img/logout.svg" alt="logout">Login
            </button>
        </header>
        <main>
            <section class="planet">
                <!--section-->
                <section class="planet-info">
                    <p class="welcome">
                        Welcome to GreenShop
                    </p>
                    <h1 class="section-title">Let’s Make a
                        Better <span class="title-span">Planet</span></h1>
                    <p class="section-description">
                        We are an online plant shop offering a wide range of cheap and trendy plants. Use our plants
                        to
                        create an unique Urban
                        Jungle. Order your favorite plants!
                    </p>
                    <a class="shop-now-link" href="#">Shop Now</a>
                </section>
                <!--picture-->
                <img src="./img/plants.png" alt="plants">
            </section>
        </main>
    </div>

</body>

</html>
